<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">Recorded Gaudi2 throughput</title>
  <desc id="desc">Decode service measurements use DFlash2 block four and greedy sampling. Prefill uses 8192-row windows; 16K and 32K are service results, longer prompts are standalone probes. Decode and prefill have independent axes, both in tokens per second.</desc>
