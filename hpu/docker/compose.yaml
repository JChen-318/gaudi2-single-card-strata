# Strata on one Intel Gaudi2. From the repository root:
#   MODELS=/path/to/models TOKENIZER=/path/to/tokenizer docker compose -f hpu/docker/compose.yaml up -d --build
# MODELS holds qwen3.8-flash-next-uncensored-iq4xs/ (the IQ4_XS GGUF, 3 shards) and qwen3.8-flash-next-dflash2/
# (the DFlash2 draft model); TOKENIZER is the model's tokenizer directory. The API is on http://<host>:8080/v1.
services:
  strata-gaudi2:
    image: strata-gaudi2:latest
    build:
      context: ../..
      dockerfile: hpu/docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: strata-gaudi2
    restart: unless-stopped
    # The card, the host IPC namespace and unlimited locked memory (pinned host buffers).
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
      - /dev/accel/accel_controlD0:/dev/accel/accel_controlD0
    ipc: host
    network_mode: host
    cap_add: [SYS_NICE]
    ulimits:
      memlock: {soft: -1, hard: -1}
    environment:
      STRATA_PORT: ${STRATA_PORT:-8080}
      API_KEY: ${API_KEY:-}
      WARMUP: ${WARMUP:-1}
    volumes:
      - ${MODELS:?set MODELS to the models directory}:/models:ro
      - ${TOKENIZER:?set TOKENIZER to the tokenizer directory}:/tokenizer:ro
      - ${LOGS:-./strata-logs}:/var/log/strata
